    <!-- Fonts: preconnect + genuinely non-render-blocking load.
         Load the (large, ~20-family) stylesheet as media="print" so it doesn't
         block first paint, then flip to all once it arrives. display=swap means
         text shows immediately in fallback fonts and swaps in with no blank flash.
         <noscript> keeps fonts working if JS is disabled. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Bridge launch screen: painted by the HTML (in <body> below) the instant
         it loads, before React boots, so there's no blank gap after the native
         splash. The inline check tags <html> so a normal browser tab never shows it. -->
    <link rel="preload" as="image" href="/icons/icon-512.png" />
    <style>
      /* Inline so the launch screen is FULLY styled at first paint, before
         index.css (bundled with the JS) loads — kills the unstyled/white/font-swap
         flash. The native splash is a plain cream fill (no icon), so the icon +
         wordmark animate in HERE exactly once, at their final spot — the icon can
         never mismatch/shift against the native splash. The @font-face is duplicated
         here (nevis.ttf is preloaded above) so the wordmark renders in Nevis.
         Literal colors because the CSS variables aren't defined yet here. */
      @font-face {
        font-family: 'Nevis';
        src: url('/fonts/nevis.ttf') format('truetype');
        font-weight: 100 900;
        font-display: swap;
      }
      html, body { background: #E3DAC9; }
      #launch-screen { display: none; }
      html.pwa-standalone #launch-screen {
        display: flex; align-items: center; justify-content: center;
        position: fixed; inset: 0; z-index: 3000;
        background: #E3DAC9; transition: opacity 0.5s ease;
      }
      #launch-screen img {
        width: 32vmin; height: 32vmin;
        opacity: 0;
        animation: launchIcon 0.55s ease 0.05s forwards;
      }
      @keyframes launchIcon {
        from { opacity: 0; transform: scale(0.92); }
        to { opacity: 1; transform: scale(1); }
      }
      #launch-screen .launch-wordmark {
        position: absolute; top: calc(50% + 19vmin);
        font-family: 'Nevis', 'Noto Sans TC', system-ui, sans-serif;
        font-size: clamp(2rem, 9vmin, 3rem); letter-spacing: -0.02em;
        color: #1A1A1A; opacity: 0;
        animation: launchWordmark 0.6s ease 0.3s forwards;
      }
      @keyframes launchWordmark {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
      }
      @media (prefers-reduced-motion: reduce) {
        #launch-screen img, #launch-screen .launch-wordmark { animation: none; opacity: 1; }
      }
      #launch-screen.launch-hide { opacity: 0; pointer-events: none; }
    </style>
    <script>
      (function () {
        try {
          var standalone =
            (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) ||
            window.navigator.standalone === true ||
            location.search.indexOf('splash') > -1;
          if (standalone) document.documentElement.classList.add('pwa-standalone');
        } catch (e) {}
      })();
    </script>
