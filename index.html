<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>CineRooms — Your Cinematic Journal</title>
    <meta name="description" content="A personal cinematic journal: rate, review and revisit the films you love." />
    <meta name="robots" content="index,follow" />
    <link rel="canonical" href="https://cinerooms.vercel.app/" />

    <!-- Site chrome uses self-hosted Nevis plus one CJK fallback. The many
         per-review faces are injected on demand by reviewFonts.js. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Every poster on the site comes from here — it serves more requests than any
         other origin, and it was the only one we hadn't warmed. Without this, DNS + TCP
         + TLS to TMDB can't even BEGIN until React has booted, the API has answered and
         the shelf has rendered. Both variants: the sampler fetches CORS, the covers
         no-CORS, and they're separate connections. -->
    <link rel="preconnect" href="https://image.tmdb.org" />
    <link rel="preconnect" href="https://image.tmdb.org" crossorigin />
    <!-- Preload the self-hosted Nevis display face used for the CINEROOMS wordmark -->
    <link rel="preload" as="font" type="font/ttf" href="/fonts/nevis.ttf" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700;900&display=swap" />
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700;900&display=swap" />
    </noscript>

    <!-- Open Graph / social link previews -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="CineRooms" />
    <meta property="og:title" content="CineRooms — Your Cinematic Journal" />
    <meta property="og:description" content="A personal cinematic journal: rate, review and revisit the films you love." />
    <meta property="og:url" content="https://cinerooms.vercel.app/" />
    <meta property="og:image" content="https://cinerooms.vercel.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="CineRooms — Your Cinematic Journal" />
    <meta name="twitter:description" content="A personal cinematic journal: rate, review and revisit the films you love." />
    <meta name="twitter:image" content="https://cinerooms.vercel.app/og-image.png" />

    <!-- Icons -->
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />

    <!-- PWA: installable, full-screen on phones -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#E3DAC9" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="CineRooms" />

    <!-- Bridge launch screen: painted by the HTML (in <body> below) the instant
         it loads, before React boots, so there's no blank gap after the native
         splash. The inline check tags <html> so a normal browser tab never shows it. -->
    <style>
      /* Inline so the launch screen is FULLY styled at first paint, before
         index.css (bundled with the JS) loads — kills the unstyled/white/font-swap
         flash. The native splash is a plain cream fill (no icon), so the icon +
         wordmark animate in HERE exactly once, at their final spot — the icon can
         never mismatch/shift against the native splash. The @font-face is duplicated
         here (nevis.ttf is preloaded above) so the wordmark renders in Nevis.
         Literal colors because the CSS variables aren't defined yet here. */
      @font-face {
        font-family: 'Nevis';
        src: url('/fonts/nevis.ttf') format('truetype');
        font-weight: 100 900;
        font-display: swap;
      }
      /* Only <html> paints the cream. If <body> also has a background, it paints
         in the element-background layer — which sits ABOVE negative-z-index
         elements — and completely hides the WebGL backdrop behind the page.
         <html>'s colour still shows if WebGL never comes up. */
      html { background: #E3DAC9; }
      body { background: transparent; }
      #launch-screen { display: none; }
      html.pwa-standalone #launch-screen {
        display: flex; align-items: center; justify-content: center;
        position: fixed; inset: 0; z-index: 3000;
        background: #E3DAC9; transition: opacity 0.5s ease;
      }
      #launch-screen img {
        width: 32vmin; height: 32vmin;
        opacity: 0;
        animation: launchIcon 0.55s ease 0.05s forwards;
      }
      @keyframes launchIcon {
        from { opacity: 0; transform: scale(0.92); }
        to { opacity: 1; transform: scale(1); }
      }
      #launch-screen .launch-wordmark {
        position: absolute; top: calc(50% + 19vmin);
        font-family: 'Nevis', 'Noto Sans TC', system-ui, sans-serif;
        font-size: clamp(2rem, 9vmin, 3rem); letter-spacing: -0.02em;
        color: #1A1A1A; opacity: 0;
        animation: launchWordmark 0.6s ease 0.3s forwards;
      }
      @keyframes launchWordmark {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
      }
      @media (prefers-reduced-motion: reduce) {
        #launch-screen img, #launch-screen .launch-wordmark { animation: none; opacity: 1; }
      }
      #launch-screen.launch-hide { opacity: 0; pointer-events: none; }
    </style>
    <script src="/bootstrap.js"></script>
